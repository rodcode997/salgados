<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Opções de visual</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f5; margin: 0; padding: 32px; }
  h1 { text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 28px; max-width: 1500px; margin: auto; }
  figure { margin: 0; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px #0001; }
  img { width: 100%; display: block; cursor: zoom-in; }
  figcaption { padding: 14px 18px; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Escolha um visual</h1>
  <div class="grid">
    <figure><a href="opcao1.jpg" target="_blank"><img src="opcao1.jpg" /></a><figcaption>1 · Glass / Gradiente</figcaption></figure>
    <figure><a href="opcao2.jpg" target="_blank"><img src="opcao2.jpg" /></a><figcaption>2 · Minimalista (Notion / Linear)</figcaption></figure>
    <figure><a href="opcao3.jpg" target="_blank"><img src="opcao3.jpg" /></a><figcaption>3 · Dark premium</figcaption></figure>
    <figure><a href="opcao4.jpg" target="_blank"><img src="opcao4.jpg" /></a><figcaption>4 · Divertido / Food app</figcaption></figure>
  </div>
</body>
</html>
